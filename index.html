<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="calculadora.css">
</head>
<body>
  <main>
    <div class="calculadora">
      <h1 style="color: black;">CALCULADORA</h1>
      <input id="resultado" type="text" placeholder="digite...">

      <div class="botoes">
        <div>
          <button onclick="adicionar('1')">1</button>
          <button onclick="adicionar('2')">2</button>
          <button onclick="adicionar('3')">3</button>
          <button onclick="adicionar('0')">0</button>
        </div>
        <div>
          <button onclick="adicionar('4')">4</button>
          <button onclick="adicionar('5')">5</button>
          <button onclick="adicionar('6')">6</button>
          <button onclick="adicionar('-')">-</button>
        </div>
        <div>
          <button onclick="adicionar('7')">7</button>
          <button onclick="adicionar('8')">8</button>
          <button onclick="adicionar('9')">9</button>
          <button onclick="adicionar('+')">+</button>
        </div>
        <div>
          <button onclick="adicionar('*')">*</button>
          <button onclick="adicionar('/')">/</button>
          <button class="calcular" onclick="calcular()">=</button>
          <button onclick="limpar()">C</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function adicionar(valor) {
      document.getElementById('resultado').value += valor;
    }

    function calcular() {
      const conta = document.getElementById('resultado').value;
      try {
        document.getElementById('resultado').value = eval(conta);
      } catch {
        document.getElementById('resultado').value = 'Erro';
      }
    }

    function limpar() {
      document.getElementById('resultado').value = '';
    }
  </script>
</body>
</html>
